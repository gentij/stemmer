[package]
name = "stemmer"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "stemmer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "^2"
http = "1"
tokio = { version = "1", features = ["fs"] }
urlencoding = "2"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
stem-splitter-core = { version = "1.2.0", default-features = false, features = ["coreml", "xnnpack"] }

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
stem-splitter-core = { version = "1.2.0", default-features = false, features = ["xnnpack"] }

[target.'cfg(target_os = "windows")'.dependencies]
stem-splitter-core = { version = "1.2.0", default-features = false, features = ["cuda", "directml", "onednn", "xnnpack"] }

[target.'cfg(target_os = "linux")'.dependencies]
stem-splitter-core = { version = "1.2.0", default-features = false, features = ["cuda", "onednn", "xnnpack"] }
